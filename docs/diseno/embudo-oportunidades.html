<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CRM Comercial · Embudo de oportunidades — Mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap">
<!--
  MOCKUP — Módulo Embudo de Oportunidades (CRM Comercial) · CCM · Plataforma de gestión
  Guía visual sin backend: datos de ejemplo escritos a mano, interacción simulada en JS.
  Sistema visual: el mismo de los mockups de la plataforma (Geist / Geist Mono, tokens shadcn,
  verde de marca #0F7A4D, radio 0.625rem). Los únicos colores propios del módulo son los de las 6 etapas.
  Navegación entre pantallas: botón «Pantallas del mockup» (abajo a la derecha) o rutas #/embudo, #/tabla, #/oportunidad/6.
-->
<style>
/* ============ Tokens (idénticos a app/globals.css de la plataforma) ============ */
:root{
 --background:#FFFFFF;--foreground:#0A0A0A;--card:#FFFFFF;--popover:#FFFFFF;
 --primary:#0F7A4D;--primary-foreground:#FFFFFF;--primary-text:#0F7A4D;
 --secondary:#F5F5F5;--secondary-foreground:#171717;
 --muted:#F5F5F5;--muted-foreground:#666666;
 --accent:#ECFDF5;--accent-foreground:#0A0A0A;
 --destructive:#C62828;--success:#15803D;--info:#1D4ED8;
 --border:#E5E5E5;--input:#E5E5E5;--ring:#0F7A4D;
 --radius:0.625rem;
 --sidebar:#FAFAFA;--sidebar-border:#E5E5E5;
 --scrim:rgb(0 0 0 / .5);
 --r-sm:calc(var(--radius) - 4px);--r-md:calc(var(--radius) - 2px);--r-lg:var(--radius);--r-xl:calc(var(--radius) + 4px);
 --shadow-xs:0 1px 2px 0 rgb(0 0 0 / .05);
 --shadow-md:0 4px 6px -1px rgb(0 0 0 / .1),0 2px 4px -2px rgb(0 0 0 / .1);
 --shadow-lg:0 10px 15px -3px rgb(0 0 0 / .1),0 4px 6px -4px rgb(0 0 0 / .1);
 --shadow-xl:0 20px 25px -5px rgb(0 0 0 / .12),0 8px 10px -6px rgb(0 0 0 / .1);
 /* Colores de etapa — únicos colores propios del módulo */
 --st-0:#71717A; /* Prospecto   · gris        */
 --st-1:#7C3AED; /* Cotización  · morado      */
 --st-2:#EA580C; /* Negociación · naranja     */
 --st-3:#16A34A; /* Adjudicado  · verde       */
 --st-4:#1E3A8A; /* Ejecución   · azul oscuro */
 --st-5:#14532D; /* Finalizado  · verde oscuro*/
 color-scheme:light;
}
:root[data-theme="dark"]{
 --background:#0A0A0A;--foreground:#FAFAFA;--card:#141414;--popover:#171717;
 --primary:#0F7A4D;--primary-foreground:#FFFFFF;--primary-text:#34C27F;
 --secondary:#262626;--secondary-foreground:#FAFAFA;
 --muted:#1F1F1F;--muted-foreground:#A1A1A1;
 --accent:#0E2A1D;--accent-foreground:#FAFAFA;
 --destructive:#EF5350;--success:#4ADE80;--info:#60A5FA;
 --border:#2A2A2A;--input:#333333;--ring:#22A06B;
 --sidebar:#111111;--sidebar-border:#262626;
 --scrim:rgb(0 0 0 / .7);
 --shadow-xs:0 1px 2px 0 rgb(0 0 0 / .4);
 --shadow-md:0 4px 6px -1px rgb(0 0 0 / .5),0 2px 4px -2px rgb(0 0 0 / .5);
 --shadow-lg:0 10px 15px -3px rgb(0 0 0 / .6),0 4px 6px -4px rgb(0 0 0 / .5);
 --shadow-xl:0 20px 25px -5px rgb(0 0 0 / .7),0 8px 10px -6px rgb(0 0 0 / .6);
 --st-0:#A1A1AA;--st-1:#A78BFA;--st-2:#FB923C;--st-3:#4ADE80;--st-4:#7B93F0;--st-5:#22A35A;
 color-scheme:dark;
}
.s0{--st:var(--st-0)}.s1{--st:var(--st-1)}.s2{--st:var(--st-2)}.s3{--st:var(--st-3)}.s4{--st:var(--st-4)}.s5{--st:var(--st-5)}

/* ============ Base ============ */
*{box-sizing:border-box}
html{scroll-behavior:auto}
body{margin:0;font-family:'Geist',ui-sans-serif,system-ui,sans-serif;color:var(--foreground);background:var(--background);-webkit-font-smoothing:antialiased;font-size:14px;line-height:1.43}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit;margin:0}
button{cursor:pointer}
h1,h2,h3,p,ul,dl,dd{margin:0}
ul{padding:0;list-style:none}
svg{flex-shrink:0}
.mono{font-family:'Geist Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted-foreground)}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{animation:spin 1s linear infinite}

/* ============ Botones / inputs (shadcn) ============ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 16px;border-radius:var(--r-md);font-size:14px;font-weight:500;border:1px solid transparent;background:transparent;white-space:nowrap;line-height:1;transition:background .15s,border-color .15s}
.btn-sm{height:32px;padding:0 12px;gap:6px;font-size:13px}
.btn-primary{background:var(--primary);color:var(--primary-foreground)}
.btn-primary:hover{background:color-mix(in srgb,var(--primary) 88%,#000)}
.btn-outline{background:var(--background);border-color:var(--border);box-shadow:var(--shadow-xs)}
.btn-outline:hover{background:var(--muted)}
.btn-ghost:hover{background:var(--muted)}
.btn-destructive{background:var(--destructive);color:#fff}
.btn-destructive:hover{background:color-mix(in srgb,var(--destructive) 88%,#000)}
.btn-text-d{color:var(--destructive)}
.btn-outline.btn-text-d:hover{background:color-mix(in srgb,var(--destructive) 8%,var(--background))}
.btn[disabled]{opacity:.5;pointer-events:none}
.btn-icon{width:32px;height:32px;padding:0;border-radius:var(--r-md);display:inline-flex;align-items:center;justify-content:center;background:transparent;border:1px solid transparent;color:var(--muted-foreground)}
.btn-icon:hover{background:var(--muted);color:var(--foreground)}
.btn-icon.xs{width:26px;height:26px}
.input{display:flex;align-items:center;gap:8px;width:100%;height:36px;padding:0 12px;border:1px solid var(--input);border-radius:var(--r-md);background:var(--background);font-size:14px;box-shadow:var(--shadow-xs);outline:none;text-align:left;white-space:nowrap}
.input::placeholder{color:var(--muted-foreground)}
.input:focus,.input:focus-within,.input[aria-expanded="true"]{border-color:var(--ring);box-shadow:0 0 0 3px color-mix(in srgb,var(--ring) 28%,transparent)}
.input.invalid{border-color:var(--destructive);box-shadow:0 0 0 3px color-mix(in srgb,var(--destructive) 16%,transparent)}
.input.ro{background:var(--muted);box-shadow:none;color:var(--muted-foreground);font-style:italic}
.input[disabled],.input.disabled{opacity:.55;cursor:not-allowed;box-shadow:none}
.input .bare{border:none;outline:none;background:transparent;flex:1;min-width:0;height:100%;padding:0;font-size:14px}
.input .bare::placeholder{color:var(--muted-foreground)}
.addon{color:var(--muted-foreground);font-size:13px;flex-shrink:0}
textarea.input{height:auto;min-height:84px;padding:8px 12px;resize:vertical;white-space:normal;line-height:1.45;display:block}
.sel{cursor:pointer;justify-content:space-between;width:auto}
.sel .sel-v{font-weight:500;overflow:hidden;text-overflow:ellipsis}
.sel svg{color:var(--muted-foreground)}
.label{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:500;line-height:1;margin-bottom:8px}
.opt{font-weight:400;color:var(--muted-foreground);font-size:13px}
.ferr{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--destructive);margin-top:6px}
.fdesc{font-size:13px;color:var(--muted-foreground);margin-top:6px}
.seg{display:inline-flex;padding:3px;gap:2px;border-radius:var(--r-md);background:var(--muted);border:1px solid var(--border);height:36px;align-items:center}
.seg button{height:28px;padding:0 10px;border-radius:calc(var(--r-md) - 2px);border:1px solid transparent;background:transparent;font-size:13px;font-weight:500;color:var(--muted-foreground);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.seg button:hover{color:var(--foreground)}
.seg button[aria-pressed="true"],.seg button[aria-checked="true"]{background:var(--background);color:var(--foreground);border-color:var(--border);box-shadow:var(--shadow-xs)}

/* ============ Badges / etiquetas ============ */
.badge{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:var(--r-md);border:1px solid transparent;font-size:12px;font-weight:500;white-space:nowrap;line-height:1}
.dot{width:6px;height:6px;border-radius:999px;flex-shrink:0;background:currentColor}
.tag-mine{background:var(--accent);border-color:color-mix(in srgb,var(--primary) 22%,var(--background));color:var(--primary-text)}
.stag{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:var(--r-md);font-size:12px;font-weight:500;white-space:nowrap;line-height:1;
 background:color-mix(in srgb,var(--st) 11%,var(--background));border:1px solid color-mix(in srgb,var(--st) 28%,var(--background));color:color-mix(in srgb,var(--st) 78%,var(--foreground))}
.stag .dot{background:var(--st)}
.b-open{background:color-mix(in srgb,var(--success) 7%,var(--background));border-color:color-mix(in srgb,var(--success) 28%,var(--background));color:var(--success)}
.b-lost{background:color-mix(in srgb,var(--destructive) 7%,var(--background));border-color:color-mix(in srgb,var(--destructive) 28%,var(--background));color:var(--destructive)}
.b-void{background:var(--muted);border-color:var(--border);color:var(--muted-foreground)}
.b-done{background:color-mix(in srgb,var(--st-5) 10%,var(--background));border-color:color-mix(in srgb,var(--st-5) 30%,var(--background));color:color-mix(in srgb,var(--st-5) 80%,var(--foreground))}
.b-plain{border-color:var(--border);background:var(--background);color:var(--foreground)}
.avatar{width:32px;height:32px;border-radius:var(--r-md);background:var(--muted);border:1px solid var(--border);display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex-shrink:0}
.av-sm{width:22px;height:22px;border-radius:999px;font-size:10px;font-weight:600;background:var(--secondary);border:1px solid var(--border);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--foreground)}

/* ============ Shell ============ */
.app{display:flex;min-height:100vh}
.sb{width:256px;flex-shrink:0;height:100vh;position:sticky;top:0;background:var(--sidebar);border-right:1px solid var(--sidebar-border);display:flex;flex-direction:column;z-index:30;transition:width .18s ease}
.sb-head{padding:8px}
.sb-brand{display:flex;align-items:center;gap:8px;padding:8px;border-radius:var(--r-md);overflow:hidden}
.sb-logo{width:32px;height:32px;border-radius:var(--r-md);background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sb-content{flex:1;min-height:0;overflow:auto;padding:0 8px}
.sb-group{padding:6px 0}
.sb-glabel{display:flex;align-items:center;height:32px;padding:0 8px;font-size:12px;font-weight:500;color:color-mix(in srgb,var(--foreground) 65%,var(--sidebar));white-space:nowrap;overflow:hidden}
.sb-item{display:flex;align-items:center;gap:8px;width:100%;height:32px;padding:0 8px;border-radius:var(--r-md);font-size:14px;color:var(--foreground);margin-bottom:2px;white-space:nowrap;overflow:hidden}
.sb-item svg{color:var(--muted-foreground)}
.sb-item:hover{background:var(--muted)}
.sb-item.active{background:var(--accent);color:var(--accent-foreground);font-weight:500}
.sb-item.active svg{color:var(--primary-text)}
.sb-soon{margin-left:auto;font-size:11px;color:var(--muted-foreground);font-weight:400}
.sb-foot{padding:8px;border-top:1px solid var(--sidebar-border)}
.sb-user{display:flex;align-items:center;gap:8px;padding:6px 8px;overflow:hidden}
.app.collapsed .sb{width:49px}
.app.collapsed .sb .lbl,.app.collapsed .sb-glabel,.app.collapsed .sb-soon{display:none}
.app.collapsed .sb-item{width:32px;padding:0;justify-content:center;margin-left:auto;margin-right:auto}
.app.collapsed .sb-brand{padding:8px 0;justify-content:center}
.app.collapsed .sb-content{padding:0 8px}
.app.collapsed .sb-group+.sb-group{border-top:1px solid var(--sidebar-border)}
.app.collapsed .sb-user{padding:6px 0;justify-content:center}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{height:56px;display:flex;align-items:center;gap:8px;padding:0 16px;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--background) 92%,transparent);backdrop-filter:blur(6px)}
.vsep{width:1px;height:16px;background:var(--border);margin:0 4px}
.crumbs{display:flex;align-items:center;gap:6px;font-size:14px;white-space:nowrap;overflow:hidden;min-width:0}
.crumbs a{color:var(--muted-foreground)}
.crumbs a:hover{color:var(--foreground)}
.crumbs .cur{font-weight:500;overflow:hidden;text-overflow:ellipsis}
.page{padding:24px;display:flex;flex-direction:column;gap:16px;min-width:0}
.h1{font-size:24px;font-weight:600;letter-spacing:-.02em;line-height:1.2}
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:25;display:none}

/* ============ Cabecera del módulo ============ */
.mhead{display:flex;justify-content:space-between;align-items:flex-start;gap:24px}
.mtitle{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.msub{margin-top:6px;color:var(--muted-foreground);font-size:14px}
.msub .live{margin-right:8px;vertical-align:1px}
.live{position:relative;display:inline-flex;width:8px;height:8px}
.live i{position:absolute;inset:0;border-radius:999px;background:var(--success)}
.live i:first-child{opacity:.55;animation:ping 1.4s cubic-bezier(0,0,.2,1) infinite}
@keyframes ping{75%,100%{transform:scale(2.2);opacity:0}}
@media (prefers-reduced-motion:reduce){.live i:first-child{animation:none}}
.mright{display:flex;flex-direction:column;align-items:flex-end;gap:10px;flex-shrink:0}
.stats{display:flex;align-items:stretch;border:1px solid var(--border);border-radius:var(--r-lg);background:var(--card);overflow:hidden}
.stat{padding:6px 14px;display:flex;flex-direction:column;align-items:flex-end;gap:1px}
.stat+.stat{border-left:1px solid var(--border)}
.stat b{font-family:'Geist Mono',monospace;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat span{font-size:11.5px;color:var(--muted-foreground);white-space:nowrap}
.filters{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.filters .viewtog{margin-left:auto}
.search{flex:0 1 300px;min-width:200px}
.clear{color:var(--muted-foreground)}

/* ============ Embudo (kanban) ============ */
.board-wrap{position:relative;margin:0 -24px;padding:0 24px}
.board{display:grid;grid-template-columns:repeat(6,minmax(212px,1fr));gap:12px;overflow-x:auto;padding-bottom:8px;align-items:stretch}
.col{display:flex;flex-direction:column;border-radius:var(--r-lg);background:color-mix(in srgb,var(--muted) 70%,var(--background));border:1px solid var(--border);min-height:420px;position:relative;transition:background .12s,box-shadow .12s}
.col::before{content:"";position:absolute;left:-1px;right:-1px;top:-1px;height:3px;border-radius:var(--r-lg) var(--r-lg) 0 0;background:var(--st)}
.col-h{padding:12px 12px 10px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--border)}
.col-t{display:flex;align-items:center;gap:8px}
.col-n{font-size:12px;font-weight:600;color:color-mix(in srgb,var(--st) 80%,var(--foreground))}
.col-name{font-weight:600;font-size:14px}
.col-c{margin-left:auto;min-width:22px;height:20px;padding:0 6px;border-radius:999px;background:var(--background);border:1px solid var(--border);font-size:12px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.col-sum{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;font-size:12px}
.col-sum .sums{display:flex;flex-direction:column;align-items:flex-end;gap:1px}
.col-sum .sums span{font-family:'Geist Mono',monospace;font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.col-sum .sums span.pen{color:var(--muted-foreground);font-weight:500}
.col-body{padding:8px;display:flex;flex-direction:column;gap:8px;flex:1}
.col-empty{border:1px dashed var(--border);border-radius:var(--r-md);padding:16px 8px;text-align:center;font-size:12.5px;color:var(--muted-foreground)}
.col.is-target{background:color-mix(in srgb,var(--st) 9%,var(--background));box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--st) 55%,transparent)}
.col.is-target .col-body::after{content:"Soltar aquí";display:block;border:1.5px dashed color-mix(in srgb,var(--st) 60%,transparent);border-radius:var(--r-md);padding:18px 8px;text-align:center;font-size:12.5px;font-weight:500;color:color-mix(in srgb,var(--st) 80%,var(--foreground))}

.card{display:flex;flex-direction:column;gap:6px;padding:10px 12px 10px 11px;border-radius:var(--r-md);background:var(--card);border:1px solid var(--border);border-left:3px solid var(--st);box-shadow:var(--shadow-xs);cursor:grab;user-select:none;-webkit-user-select:none;transition:box-shadow .15s,border-color .15s,opacity .15s;touch-action:manipulation}
.card:hover{box-shadow:var(--shadow-md);border-color:color-mix(in srgb,var(--foreground) 18%,var(--border));border-left-color:var(--st)}
.c-code{font-size:11px;color:var(--muted-foreground);letter-spacing:.01em}
.c-title{font-size:13.5px;font-weight:500;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.c-emp{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted-foreground);min-width:0}
.c-emp span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c-val{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-top:2px}
.c-val .v{font-size:13.5px;font-weight:600;white-space:nowrap}
.c-prob{font-size:12px;font-weight:500;color:var(--muted-foreground);padding:1px 6px;border-radius:var(--r-sm);background:var(--muted)}
.c-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:8px;border-top:1px solid var(--border);font-size:12px}
.c-user{display:flex;align-items:center;gap:6px;min-width:0;color:var(--muted-foreground)}
.c-user span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c-days{display:inline-flex;align-items:center;gap:4px;color:var(--muted-foreground);white-space:nowrap}
.c-days.warn{color:var(--destructive);font-weight:500}
.card.is-origin{opacity:.35;border-style:dashed;box-shadow:none}
.ghost{position:fixed;z-index:70;pointer-events:none;margin:0;transform:rotate(2.5deg) scale(1.03);box-shadow:var(--shadow-xl),0 0 0 1px color-mix(in srgb,var(--st) 40%,transparent);cursor:grabbing;opacity:.97}
body.dragging,body.dragging *{cursor:grabbing!important}
body.dragging{user-select:none}

/* Papelera: cuarto de círculo abajo a la izquierda, solo visible al arrastrar */
.trash{position:fixed;left:0;bottom:0;width:132px;height:132px;border-top-right-radius:100%;background:var(--destructive);color:#fff;z-index:65;transform:scale(0);transform-origin:0 100%;transition:transform .18s cubic-bezier(.2,.9,.3,1.2),background .12s;display:flex;align-items:flex-end;justify-content:flex-start;padding:0 0 30px 30px;box-shadow:var(--shadow-lg)}
.trash .t-lbl{position:absolute;left:22px;bottom:76px;font-size:11px;font-weight:600;letter-spacing:.02em;opacity:.9;white-space:nowrap}
body.dragging .trash{transform:scale(1)}
body.dragging .trash.hot{transform:scale(1.18);background:color-mix(in srgb,var(--destructive) 85%,#000)}
.drag-hint{position:fixed;top:68px;left:50%;transform:translateX(-50%);z-index:75;background:var(--foreground);color:var(--background);font-size:12.5px;font-weight:500;padding:6px 12px;border-radius:999px;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:8px}

/* ============ Tabla ============ */
.tcard{border:1px solid var(--border);border-radius:var(--r-lg);background:var(--card);overflow:hidden}
.tscroll{overflow-x:auto}
table.t{width:100%;min-width:1322px;border-collapse:separate;border-spacing:0;table-layout:fixed;font-size:13px}
.t th{height:44px;padding:4px 12px;text-align:left;font-weight:500;color:var(--muted-foreground);border-bottom:1px solid var(--border);line-height:1.2;background:var(--card)}
.t td{height:52px;padding:6px 12px;border-bottom:1px solid var(--border);vertical-align:middle;background:var(--card);overflow:hidden}
.t tbody tr{cursor:pointer}
.t tbody tr:hover td{background:var(--accent)}
.t tbody tr:last-child td{border-bottom:none}
.t .r{text-align:right}

        H('2026-06-18 12:15', 'move', { from: 0, to: 1 }),
        H('2026-07-02 09:00', 'meeting', { text: 'Presentación de la propuesta técnica al área de proyectos de la pesquera.' }),

        H('2026-09-11 16:05', 'lost', { text: op.reason }),
      ];

    }
    const hs = [H(op.created + ' 09:' + String(10 + (op.n * 7) % 49).padStart(2, '0'), 'create', { stage: 0 })];
    const endStage = op.stage;
    const lastTs = op.status === 'activa' ? op.lastMove : shiftDate(op.lastMove, -3);
    for (let k = 1; k <= endStage; k++) {

      hs.push(H(d + ' ' + String(9 + (k * 3 + op.n) % 9).padStart(2, '0') + ':' + String((op.n * 13 + k * 17) % 60).padStart(2, '0'), 'move', { from: k - 1, to: k }));
    }
    if (op.status === 'perdida') hs.push(H(op.lastMove + ' 15:30', 'lost', { text: op.reason }));
    if (op.status === 'anulada') hs.push(H(op.lastMove + ' 08:55', 'void', { text: op.reason }));
    op.hist = hs;
  }
}

function matchCommon(op) {
  if (S.q) {
    const q = norm(S.q);
    if (!norm(op.title).includes(q) && !norm(empById(op.emp).name).includes(q)) return false;
  }
  if (S.cliente && op.emp !== S.cliente) return false;
  const u = usdEq(op);
  if (S.valor === 'lt10' && !(u < 10000)) return false;
  if (S.valor === '10-50' && !(u >= 10000 && u <= 50000)) return false;
  if (S.valor === '50-200' && !(u > 50000 && u <= 200000)) return false;
  if (S.valor === 'gt200' && !(u > 200000)) return false;
  if (S.quick === 'sin-mover' && !(op.status === 'activa' && idleDays(op) >= 7)) return false;
  if (S.quick === 'mas-50k' && !(u > 50000)) return false;
  return true;
}

function tableSet() {

    if (S.estado === 'perdidas' && op.status !== 'perdida') return false;
    if (S.estado === 'anuladas' && op.status !== 'anulada') return false;

      <td class="stk-l"><span class="mono" style="font-size:12px;font-weight:500">${code(op)}</span></td>
      <td><span class="trunc" title="${esc(op.title)}" style="font-weight:500">${esc(op.title)}</span></td>

/* =====================================================================
   RUTAS  (#/embudo · #/tabla · #/oportunidad/:n)
   ===================================================================== */
function currentRoute() {
  const h = location.hash || '#/embudo';
  const m = h.match(/^#\/oportunidad\/(\d+)/);
  if (m) return { view: 'detalle', id: Number(m[1]) };
  if (h.startsWith('#/tabla')) return { view: 'tabla' };
  return { view: 'embudo' };
}
function render() {
  closePop(); endDemo();
  const r = currentRoute();
  if (r.view === 'detalle') viewDetail(r.id);
  else if (r.view === 'tabla') viewTable();
  else viewBoard();
  document.getElementById('app').classList.remove('mob-open');
}
let AFTER = null;
window.addEventListener('hashchange', () => { render(); window.scrollTo(0, 0); if (AFTER) { const f = AFTER; AFTER = null; f(); } });
/* Navega a una ruta y ejecuta `then` cuando la vista ya está pintada */
function goTo(hash, then) {
  if ((location.hash || '#/embudo') === hash) { render(); window.scrollTo(0, 0); if (then) then(); }
  else { AFTER = then || null; location.hash = hash; }
}

/* =====================================================================
   POPOVER genérico (Select, Combobox, menú de acciones, calendario)
   ===================================================================== */
let POP = null;
function openPop(anchor, html, { onPick, onNav, width, align = 'start' } = {}) {
  closePop();
  const el = document.createElement('div');
  el.className = 'pop';
  el.setAttribute('role', 'listbox');
  el.innerHTML = html;
  document.body.appendChild(el);
  const r = anchor.getBoundingClientRect();
  el.style.minWidth = (width || r.width) + 'px';
  const w = el.offsetWidth, h = el.offsetHeight;
  let left = align === 'end' ? r.right - w : r.left;
  left = Math.max(8, Math.min(left, innerWidth - w - 8));
  let top = r.bottom + 4;
  if (top + h > innerHeight - 8 && r.top - h - 4 > 8) top = r.top - h - 4;
  el.style.left = left + 'px'; el.style.top = top + 'px';
  anchor.setAttribute('aria-expanded', 'true');
  el.addEventListener('mousedown', e => e.preventDefault()); // no roba el foco al buscador
  el.addEventListener('click', e => {
    const nav = e.target.closest('[data-nav]');
    if (nav && onNav) { onNav(nav.dataset.nav, el); return; }
    const it = e.target.closest('[data-v]');
    if (it && onPick) { const v = it.dataset.v; closePop(); onPick(v); }
  });
  POP = { el, anchor };
  return el;
}
function closePop() {
  if (!POP) return;
  POP.anchor.setAttribute('aria-expanded', 'false');
  POP.el.remove(); POP = null;
}
document.addEventListener('pointerdown', e => { if (POP && !POP.el.contains(e.target) && !POP.anchor.contains(e.target)) closePop(); });
window.addEventListener('scroll', e => { if (POP && !(e.target instanceof Node && POP.el.contains(e.target))) closePop(); }, true);
window.addEventListener('resize', closePop);
const optList = (opts, cur) => opts.map(([v, l, sub, pre]) => `<button type="button" class="pop-item${String(v) === String(cur) ? ' sel' : ''}" data-v="${v}" role="option" aria-selected="${String(v) === String(cur)}"><span class="ck">${ic('check', 15)}</span>${pre || ''}<span style="min-width:0">${esc(l)}${sub ? `<small>${esc(sub)}</small>` : ''}</span></button>`).join('');

/* Select de filtros */
const DD = {
  cliente: { opts: () => [['', 'Todos']].concat(EMP.filter(e => OPPS.some(op => op.emp === e.id)).map(e => [e.id, e.name, 'RUC ' + e.ruc])), cur: () => S.cliente, set: v => { S.cliente = v; S.page = 1; refreshResults(); }, width: 300 },

let DLG = null;
function openDialog(html, { wide = false, onClose } = {}) {
  closeDialog(true);
  const root = document.getElementById('dlg-root');
  root.innerHTML = `<div class="overlay" data-act="dlg-scrim"><div class="dlg${wide ? ' wide' : ''}" role="dialog" aria-modal="true" aria-labelledby="dlg-title">${html}</div></div>`;
  DLG = { prevFocus: document.activeElement, onClose };
  const first = root.querySelector('[autofocus]') || root.querySelector('.dlg-b input:not([disabled]), .dlg-b textarea') || root.querySelector('.dlg-f .btn-primary, .dlg-f .btn-destructive') || root.querySelector('.dlg button');
  setTimeout(() => first && first.focus(), 30);
  return root.querySelector('.dlg');
}
function closeDialog(silent = false) {
  if (!DLG) return;
  const d = DLG; DLG = null;
  closePop();
  document.getElementById('dlg-root').innerHTML = '';
  if (!silent && d.onClose) d.onClose();
  if (d.prevFocus && d.prevFocus.focus && document.contains(d.prevFocus)) d.prevFocus.focus();
}
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (POP) { closePop(); return; }
    if (DEMO) { endDemo(); return; }
    if (DLG) { closeDialog(); return; }
  }
  if (e.key === 'Tab' && DLG) { // foco atrapado dentro del diálogo
    const f = [...document.querySelectorAll('#dlg-root .dlg :is(button,input,textarea,a[href]):not([disabled])')];
    if (!f.length) return;
    if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
    else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
  }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('tr[data-href]')) { e.preventDefault(); location.hash = e.target.dataset.href; }
});
const dlgHead = (title, desc) => `<div class="dlg-h"><h2 class="dlg-title" id="dlg-title">${title}</h2>${desc ? `<p class="dlg-desc">${desc}</p>` : ''}<button type="button" class="btn-icon dlg-x" data-act="dlg-close" aria-label="Cerrar">${ic('x')}</button></div>`;

function toast(msg, icon = 'check-circle') {
  const t = document.createElement('div');
  t.className = 'toast';
  t.innerHTML = ic(icon, 16) + `<span>${msg}</span>`;
  document.getElementById('toasts').appendChild(t);
  setTimeout(() => { t.style.transition = 'opacity .3s'; t.style.opacity = '0'; setTimeout(() => t.remove(), 320); }, 3200);
}

/* ---------- Calendario (Popover + Calendar de shadcn) ---------- */
const MES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
function calHTML(y, m, sel) {
  const first = new Date(Date.UTC(y, m, 1));
  const start = (first.getUTCDay() + 6) % 7; // lunes = 0
  const cells = [];
  for (let i = 0; i < 42; i++) {
    const d = new Date(Date.UTC(y, m, 1 - start + i));
    const s = iso(d);
    cells.push(`<button type="button" data-v="${s}" class="${d.getUTCMonth() !== m ? 'out ' : ''}${s === TODAY ? 'today ' : ''}${s === sel ? 'on' : ''}" aria-label="${fdate(s)}">${d.getUTCDate()}</button>`);
  }
  return `<div class="cal"><div class="cal-h"><button type="button" class="btn-icon" data-nav="-1" aria-label="Mes anterior">${ic('chevron-left')}</button><b>${MES[m]} ${y}</b><button type="button" class="btn-icon" data-nav="1" aria-label="Mes siguiente">${ic('chevron-right')}</button></div>
    <div class="cal-g">${['Lu', 'Ma', 'Mi', 'Ju', 'Vi', 'Sa', 'Do'].map(d => `<span class="dw">${d}</span>`).join('')}${cells.join('')}</div>
    <div class="cal-f"><button type="button" class="btn btn-ghost btn-sm" data-v="">Sin fecha</button><button type="button" class="btn btn-ghost btn-sm" data-v="${TODAY}">Hoy</button></div></div>`;
}
function openCalendar(anchor, sel, onPick) {
  const base = toD(sel || TODAY);
  let y = base.getUTCFullYear(), m = base.getUTCMonth();
  openPop(anchor, calHTML(y, m, sel), {
    width: 268, onPick,
    onNav: (dir, el) => { m += Number(dir); if (m < 0) { m = 11; y--; } if (m > 11) { m = 0; y++; } el.innerHTML = calHTML(y, m, sel); },
  });
}

/* =====================================================================
   2 · ARRASTRE (pointer events: ratón y táctil con pulsación larga)
   ===================================================================== */
let DRAG = null, SUPPRESS_CLICK = false;
const trashEl = () => document.getElementById('trash');
document.addEventListener('pointerdown', e => {
  const card = e.target.closest('.card');
  if (!card || e.button !== 0 || DEMO) return;
  const p = { id: Number(card.dataset.id), card, x0: e.clientX, y0: e.clientY, type: e.pointerType, started: false, timer: null };
  if (e.pointerType === 'touch') p.timer = setTimeout(() => startDrag(p, p.x0, p.y0), 380);
  DRAG = p;
});
document.addEventListener('pointermove', e => {
  if (!DRAG) return;
  const dx = e.clientX - DRAG.x0, dy = e.clientY - DRAG.y0;
  if (!DRAG.started) {
    if (DRAG.type === 'touch') { if (Math.hypot(dx, dy) > 8) { clearTimeout(DRAG.timer); DRAG = null; } return; }
    if (Math.hypot(dx, dy) < 6) return;
    startDrag(DRAG, e.clientX, e.clientY);
  }
  moveDrag(e.clientX, e.clientY);
});
document.addEventListener('pointerup', e => { if (DRAG) { clearTimeout(DRAG.timer); if (DRAG.started) endDrag(e.clientX, e.clientY); DRAG = null; } });
document.addEventListener('pointercancel', () => { if (DRAG) { clearTimeout(DRAG.timer); if (DRAG.started) cleanupDrag(); DRAG = null; } });
document.addEventListener('touchmove', e => { if (DRAG && DRAG.started) e.preventDefault(); }, { passive: false });
document.addEventListener('click', e => { if (SUPPRESS_CLICK && e.target.closest('.card')) { e.preventDefault(); e.stopPropagation(); } SUPPRESS_CLICK = false; }, true);

function makeGhost(card, x, y, offX, offY) {
  const r = card.getBoundingClientRect();
  const g = card.cloneNode(true);
  g.classList.add('ghost'); g.removeAttribute('href'); g.setAttribute('aria-hidden', 'true');
  g.style.width = r.width + 'px'; g.style.left = (x - offX) + 'px'; g.style.top = (y - offY) + 'px';
  document.body.appendChild(g);
  return g;
}
function startDrag(p, x, y) {
  closePop();
  const r = p.card.getBoundingClientRect();
  p.offX = x - r.left; p.offY = y - r.top;
  p.ghost = makeGhost(p.card, x, y, p.offX, p.offY);
  p.card.classList.add('is-origin');
  p.from = byId(p.id).stage;
  p.started = true;
  document.body.classList.add('dragging');
  trashEl().setAttribute('aria-hidden', 'false');
  if (navigator.vibrate && p.type === 'touch') navigator.vibrate(12);
  p.raf = requestAnimationFrame(autoScroll);
}
function hitTest(x, y) {
  const el = document.elementFromPoint(x, y);
  if (!el) return {};
  if (el.closest('#trash')) return { trash: true };
  const col = el.closest('.col');
  return col ? { col } : {};
}
function moveDrag(x, y) {
  const p = DRAG;
  p.x = x; p.y = y;
  p.ghost.style.left = (x - p.offX) + 'px';
  p.ghost.style.top = (y - p.offY) + 'px';
  const h = hitTest(x, y);
  trashEl().classList.toggle('hot', !!h.trash);
  document.querySelectorAll('.col.is-target').forEach(c => { if (c !== h.col) c.classList.remove('is-target'); });
  if (h.col && Number(h.col.dataset.stage) !== p.from) h.col.classList.add('is-target');
}
function autoScroll() {
  const p = DRAG;
  if (!p || !p.started) return;
  const board = document.getElementById('board');
  if (board && p.x != null) {
    const r = board.getBoundingClientRect();
    if (p.x < r.left + 56) board.scrollLeft -= 14;
    else if (p.x > r.right - 56) board.scrollLeft += 14;
  }
  if (p.y != null) {
    if (p.y < 90) window.scrollBy(0, -12);
    else if (p.y > innerHeight - 50) window.scrollBy(0, 12);
  }
  p.raf = requestAnimationFrame(autoScroll);
}
function cleanupDrag() {
  const p = DRAG;
  if (!p) return;
  cancelAnimationFrame(p.raf);
  p.ghost?.remove();
  p.card.classList.remove('is-origin');
  document.body.classList.remove('dragging');
  trashEl().classList.remove('hot');
  trashEl().setAttribute('aria-hidden', 'true');
  document.querySelectorAll('.col.is-target').forEach(c => c.classList.remove('is-target'));
}
function endDrag(x, y) {
  const p = DRAG;
  const h = hitTest(x, y);
  cleanupDrag();
  SUPPRESS_CLICK = true;
  setTimeout(() => { SUPPRESS_CLICK = false; }, 0);
  if (h.trash) closeOppDialog(p.id);
  else if (h.col && Number(h.col.dataset.stage) !== p.from) confirmMove(p.id, Number(h.col.dataset.stage));
}

/* Vista fija del estado de arrastre (pantalla 2 del mockup) */
let DEMO = null;
function demoDrag(n = 3, toStage = 2) {
  requestAnimationFrame(() => {
    const card = document.querySelector(`.card[data-id="${n}"]`);
    const col = document.querySelector(`.col[data-stage="${toStage}"]`);
    if (!card || !col) return;
    window.scrollTo(0, 0);
    const board = document.getElementById('board');
    board.scrollLeft = 0;
    const cr = col.getBoundingClientRect();
    if (cr.right > innerWidth) board.scrollLeft += cr.right - innerWidth + 40;
    const r2 = col.getBoundingClientRect();
    const cardR = card.getBoundingClientRect();
    const x = r2.left + 24 + cardR.width * .45, y = r2.top + 130;
    const ghost = makeGhost(card, x, y, cardR.width * .45, 30);
    card.classList.add('is-origin');
    col.classList.add('is-target');
    document.body.classList.add('dragging');
    const hint = document.createElement('div');
    hint.className = 'drag-hint';
    hint.innerHTML = `${ic('grip', 14)}Vista fija del arrastre · Esc o clic para salir`;
    document.body.appendChild(hint);
    DEMO = { ghost, card, col, hint };
  });
}
function endDemo() {
  if (!DEMO) return;
  DEMO.ghost.remove(); DEMO.hint.remove();
  DEMO.card.classList.remove('is-origin'); DEMO.col.classList.remove('is-target');
  document.body.classList.remove('dragging');
  DEMO = null;
}
document.addEventListener('pointerdown', e => { if (DEMO && !e.target.closest('.mk')) { e.preventDefault(); endDemo(); } }, true);

/* =====================================================================
   DELEGACIÓN DE EVENTOS
   ===================================================================== */
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'q') { S.q = t.value; S.page = 1; refreshResults(false); return; }
  if (!NF) return;
  const errKey = { 'nf-title': 'title', 'nf-val': 'val', 'nf-prob': 'prob', 'nf-emp': 'emp' }[t.id];
  if (errKey && NF.err[errKey]) { // el error se limpia en cuanto el usuario corrige el campo
    delete NF.err[errKey];
    (t.closest('label.input') || t).classList.remove('invalid');
    t.removeAttribute('aria-invalid'); t.removeAttribute('aria-describedby');
    document.getElementById('err-' + errKey)?.remove();
  }
  if (t.id === 'nf-title') NF.title = t.value;
  if (t.id === 'nf-val') NF.val = t.value;
  if (t.id === 'nf-prob') NF.prob = t.value.replace(/[^\d]/g, '').slice(0, 3), t.value = NF.prob;
  if (t.id === 'nf-emp') { NF.q = t.value; nfEmpSearch(t); }
});
document.addEventListener('focusin', e => { if (e.target.id === 'nf-emp') nfEmpSearch(e.target); });
document.addEventListener('focusout', e => { if (e.target.id === 'nf-emp' && POP && POP.anchor.id === 'nf-emp-box') { closePop(); e.target.setAttribute('aria-expanded', 'false'); } });
document.addEventListener('click', e => {
  const row = e.target.closest('tr[data-href]');
  const a = e.target.closest('[data-act]');
  if (row && !a) { location.hash = row.dataset.href; return; }
  if (!a) return;
  const act = a.dataset.act;
  const route = currentRoute();
  switch (act) {
    case 'go': location.hash = a.dataset.v; break;
    case 'quick': S.quick = a.dataset.v; S.page = 1; refreshResults(); break;
    case 'clear': Object.assign(S, { q: '', quick: 'todas', cliente: '', valor: '', estado: 'activas', page: 1 }); render(); break;
    case 'page': S.page = Number(a.dataset.v); document.getElementById('tbl').innerHTML = tableHTML(); tableHint(); break;
    case 'dd': {
      if (POP && POP.anchor === a) { closePop(); break; }
      const d = DD[a.dataset.key];
      openPop(a, optList(d.opts(), d.cur()), { onPick: d.set, width: d.width });
      break;
    }
    case 'new': newOpp(); break;
    case 'dlg-close': e.preventDefault(); closeDialog(); break;
    case 'dlg-scrim': if (e.target === a) closeDialog(); break;
    case 'do-move': doMove(Number(a.dataset.id), Number(a.dataset.v)); break;
    case 'nf-cur': NF.cur = a.dataset.v; nfRender(); break;
    case 'nf-emp-clear': NF.emp = null; NF.contact = null; nfRender(); setTimeout(() => document.getElementById('nf-emp')?.focus(), 0); break;
    case 'nf-date': openCalendar(a, NF.close, v => { NF.close = v || null; nfRender(); }); break;
    case 'nf-save': nfSave(); break;
    case 'row-menu': {
      e.stopPropagation();
      const op = byId(a.dataset.id);
      const items = op.status === 'activa'
        ? `<button type="button" class="pop-item" data-v="open">${ic('arrow-up-right', 15)}Abrir</button><div class="pop-sep"></div><button type="button" class="pop-item danger" data-v="lose">${ic('circle-x', 15)}Marcar perdida</button><button type="button" class="pop-item" data-v="void">${ic('ban', 15)}Anular</button>`
        : `<button type="button" class="pop-item" data-v="open">${ic('arrow-up-right', 15)}Abrir</button><button type="button" class="pop-item" data-v="reopen">${ic('rotate', 15)}Reabrir</button>`;
      openPop(a, items, { width: 190, align: 'end', onPick: v => {
        if (v === 'open') location.hash = '#/oportunidad/' + op.n;
        if (v === 'lose') closeOppDialog(op.n, 'perdida', true);
        if (v === 'void') closeOppDialog(op.n, 'anulada', true);
        if (v === 'reopen') { reopen(op.n); }
      } });
      break;
    }
    /* Detalle */
    case 'stage': { const to = Number(a.dataset.v); const op = byId(route.id); if (to !== op.stage) confirmMove(op.n, to); break; }
    case 'activity': activityDialog(route.id); break;
    case 'lose': closeOppDialog(route.id, 'perdida', true); break;
    case 'void': closeOppDialog(route.id, 'anulada', true); break;
    case 'reopen': reopen(route.id); break;
    case 'edit-title': {
      const op = byId(route.id);
      const box = document.getElementById('dtitle');
      box.innerHTML = `<input class="input" id="t-edit" value="${esc(op.title)}" aria-label="Título de la oportunidad"><button type="button" class="btn btn-primary btn-sm" data-act="title-ok">Guardar</button><button type="button" class="btn btn-ghost btn-sm" data-act="title-cancel">Cancelar</button>`;
      const inp = document.getElementById('t-edit'); inp.focus(); inp.select();
      inp.addEventListener('keydown', ev => { if (ev.key === 'Enter') box.querySelector('[data-act="title-ok"]').click(); if (ev.key === 'Escape') { ev.stopPropagation(); render(); } });
      break;
    }
    case 'title-ok': {
      const op = byId(route.id); const v = document.getElementById('t-edit').value.trim();
      if (v && v !== op.title) { op.hist.push({ t: nowTs(), user: ME.name, type: 'edit', field: 'el título', old: op.title, new: v }); op.title = v; toast('Título actualizado'); }
      render(); break;
    }
    case 'title-cancel': render(); break;
    case 'edit-contact': {
      const op = byId(route.id); const emp = empById(op.emp);
      openPop(a, optList([['', 'Sin contacto']].concat(emp.contacts.map(c => [c[0], c[1], c[2]])), op.contact || ''), { width: 240, onPick: v => {
        const oldC = op.contact ? contactById(op.emp, op.contact)[1] : 'Sin contacto';
        const newC = v ? contactById(op.emp, v)[1] : 'Sin contacto';
        if (oldC !== newC) { op.contact = v || null; op.hist.push({ t: nowTs(), user: ME.name, type: 'edit', field: 'el contacto', old: oldC, new: newC }); render(); toast('Contacto actualizado'); }
      } });
      break;
    }
    case 'edit-close': {
      const op = byId(route.id);
      openCalendar(a, op.close, v => {
        const nv = v || null;
        if (nv !== op.close) { op.hist.push({ t: nowTs(), user: ME.name, type: 'edit', field: 'la fecha estimada de cierre', old: op.close ? fdate(op.close) : 'Sin fecha', new: nv ? fdate(nv) : 'Sin fecha' }); op.close = nv; render(); toast('Fecha estimada de cierre actualizada'); }
      });
      break;
    }
    /* Shell */
    case 'toggle-sb': {
      const app = document.getElementById('app');
      if (innerWidth <= 860) app.classList.toggle('mob-open'); else app.classList.toggle('collapsed');
      setTimeout(tableHint, 220);
      break;
    }
    case 'mob-close': document.getElementById('app').classList.remove('mob-open'); break;
    case 'nav-out': e.preventDefault(); toast('Fuera del alcance de este mockup', 'alert'); break;
    case 'theme': setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'); break;
  }
});

/* =====================================================================
   TEMA CLARO / OSCURO
   ===================================================================== */
function setTheme(t) {
  document.documentElement.dataset.theme = t;
  document.querySelectorAll('[data-act="theme"]').forEach(b => { b.innerHTML = ic(t === 'dark' ? 'sun' : 'moon'); });
  const sw = document.getElementById('mk-theme');
  if (sw) sw.textContent = t === 'dark' ? 'Oscuro' : 'Claro';
}

/* =====================================================================
   NAVEGADOR DE PANTALLAS DEL MOCKUP (no es parte del producto)
   ===================================================================== */
let ORIG = [];
const clone = x => JSON.parse(JSON.stringify(x));
function restoreOpp(n) { const i = OPPS.findIndex(x => x.n === n); const src = ORIG.find(x => x.n === n); if (i >= 0 && src) OPPS[i] = clone(src); }
function restoreAll() { OPPS.length = 0; ORIG.forEach(x => OPPS.push(clone(x))); }
const resetFilters = () => Object.assign(S, { q: '', quick: 'todas', cliente: '', valor: '', estado: 'activas', page: 1 });
const SCREENS = [
  ['1', 'Vista Embudo (por defecto)', () => { resetFilters(); goTo('#/embudo'); }],
  ['2', 'Estado de arrastre', () => { resetFilters(); restoreOpp(3); goTo('#/embudo', () => demoDrag(3, 2)); }],
  ['3', 'Confirmar cambio de etapa', () => { resetFilters(); restoreOpp(3); goTo('#/embudo', () => confirmMove(3, 2)); }],
  ['4', 'Soltar en la papelera', () => { resetFilters(); restoreOpp(8); goTo('#/embudo', () => closeOppDialog(8)); }],
  ['5', 'Nueva oportunidad', () => { goTo(currentRoute().view === 'tabla' ? '#/tabla' : '#/embudo', newOpp); }],
  ['6', 'Detalle · oportunidad abierta', () => { restoreOpp(6); goTo('#/oportunidad/6'); }],
  ['7', 'Detalle · oportunidad perdida', () => { restoreOpp(16); goTo('#/oportunidad/16'); }],
  ['8', 'Vista Tabla', () => { resetFilters(); goTo('#/tabla'); }],
];
function renderMockNav() {
  const mk = document.createElement('div');
  mk.className = 'mk';
  mk.innerHTML = `<div class="mk-panel" id="mk-panel" role="menu" aria-label="Pantallas del mockup"><h3>Pantallas del mockup</h3>
    ${SCREENS.map(([n, l]) => `<button type="button" class="it" role="menuitem" data-screen="${n}"><span class="mono">${n}</span>${l}</button>`).join('')}
    <div class="row"><span>Tema</span><button type="button" class="btn btn-outline btn-sm" data-mk-theme><span id="mk-theme">Claro</span></button></div>
    <div class="row" style="border-top:none;margin-top:0;padding-top:2px"><span class="muted" style="font-size:12.5px">Deshacer cambios hechos al probar</span><button type="button" class="btn btn-ghost btn-sm" data-mk-reset>${ic('rotate', 14)}Restablecer</button></div></div>
    <button type="button" class="mk-btn" aria-expanded="false" aria-controls="mk-panel">${ic('layers', 16)}<span class="lbl">Pantallas del mockup</span></button>`;
  document.body.appendChild(mk);
  const btn = mk.querySelector('.mk-btn');
  btn.addEventListener('click', () => { const o = mk.classList.toggle('open'); btn.setAttribute('aria-expanded', o); });
  mk.addEventListener('click', e => {
    const s = e.target.closest('[data-screen]');
    if (s) { mk.classList.remove('open'); btn.setAttribute('aria-expanded', 'false'); closeDialog(true); endDemo(); SCREENS.find(x => x[0] === s.dataset.screen)[2](); }
    if (e.target.closest('[data-mk-reset]')) { mk.classList.remove('open'); closeDialog(true); restoreAll(); resetFilters(); render(); toast('Datos de ejemplo restablecidos', 'rotate'); }
    if (e.target.closest('[data-mk-theme]')) setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
  });
  document.addEventListener('pointerdown', e => { if (!mk.contains(e.target)) { mk.classList.remove('open'); btn.setAttribute('aria-expanded', 'false'); } });
}

/* =====================================================================
   ARRANQUE
   ===================================================================== */
buildHistory();
ORIG = clone(OPPS);
renderShell();
renderMockNav();
setTheme(matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
render();
/* Atajo: ?pantalla=N abre directamente una pantalla del mockup */
const qs = new URLSearchParams(location.search).get('pantalla');
if (qs) { const s = SCREENS.find(x => x[0] === qs); if (s) setTimeout(s[2], 60); }
/* Atajo para capturas: ?tema=oscuro */
if (new URLSearchParams(location.search).get('tema') === 'oscuro') setTheme('dark');
</script>
</body>
</html>
